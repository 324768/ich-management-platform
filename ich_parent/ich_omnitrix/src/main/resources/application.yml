server:
  port: 8083
spring:
  application:
    name: ich-omnitrix
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ai_service?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    database: 1

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hyang.ich.omnitrix.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

dubbo:
  application:
    name: ich-omnitrix
  registry:
    address: zookeeper://127.0.0.1:2181
  protocol:
    name: dubbo
    port: 20883
  scan:
    base-packages: com.hyang.ich.omnitrix

omnitrix:
  llm:
    # 向后兼容：顶层配置 = primary 模型
    api-url: https://api.siliconflow.cn/v1/chat/completions
    model: deepseek-ai/DeepSeek-V3
    api-key: sk-utgmwknrslowgyfkjtpqfllzclvzeyaevaayqqubpcmlmglw
    timeout-seconds: 60
    max-tokens: 2048
    temperature: 0.7
    # ---- 双模型配置（可选，不配则 auxiliary 自动复用 primary）----
    # primary:                          # 主聊天模型（高质量）
    #   api-url: https://api.siliconflow.cn/v1/chat/completions
    #   model: deepseek-ai/DeepSeek-V3
    #   api-key: sk-utgmwknrslowgyfkjtpqfllzclvzeyaevaayqqubpcmlmglw
    #   timeout-seconds: 60
    #   max-tokens: 4096
    #   temperature: 0.7
    # auxiliary:                        # 辅助任务模型（评分/标题/意图/摘要，更快更便宜）
    #   api-url: https://api.siliconflow.cn/v1/chat/completions
    #   model: deepseek-ai/DeepSeek-V3
    #   timeout-seconds: 30
    #   max-tokens: 512
    #   temperature: 0.3
  memory:
    max-messages: 20
    redis-ttl-hours: 24
    summary-enabled: true
  evaluation:
    enabled: true
    async: true
  prompts:
    master-brain-system: ""

logging:
  level:
    root: info
    com.hyang.ich.omnitrix: debug

