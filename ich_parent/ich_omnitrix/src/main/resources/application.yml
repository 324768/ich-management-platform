server:
  port: 8083
spring:
  application:
    name: ich-omnitrix
  # ---- Nacos 配置中心 ----
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yml
        refresh-enabled: true
        shared-configs:
          - data-id: common.yml
            group: DEFAULT_GROUP
            refresh: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ai_service?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 1

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hyang.ich.omnitrix.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

dubbo:
  application:
    name: ich-omnitrix
    register-mode: interface
  config-center:
    address: N/A
  registry:
    address: ${ZOOKEEPER_ADDRESS:zookeeper://127.0.0.1:2181}
  protocol:
    name: dubbo
    port: 20883
  scan:
    base-packages: com.hyang.ich.omnitrix

omnitrix:
  llm:
    # 向后兼容：顶层配置 = primary 模型
    # SiliconFlow API配置
    api-url: https://api.siliconflow.cn/v1/chat/completions
    model: deepseek-ai/DeepSeek-V3
    api-key: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  # 替换为你的SiliconFlow API Key
    timeout-seconds: 60
    max-tokens: 4096
    temperature: 0.7
    # ---- 上下文窗口配置 ----
    # 支持的上下文大小（根据模型实际能力调整）
    # Claude Sonnet 4: 200K tokens
    # Claude Opus 4: 200K tokens
    # DeepSeek V3: 64K tokens
    # Qwen 2.5: 32K tokens
    max-context-tokens: 200000
    # ---- Claude API 配置（多模态 + 大上下文）----
    claude:
      enabled: false
      api-url: https://api.anthropic.com/v1/messages
      model: claude-sonnet-4-20250514
      api-key: sk-ant-api03-xxxxxxxxxxxxxxxxxxxxxxxx  # 替换为你的Claude API Key
      timeout-seconds: 180
      max-tokens: 8192
      temperature: 0.7
      max-output-tokens: 8192
  memory:
    max-messages: 50
    redis-ttl-hours: 168
    summary-enabled: true
    summary-trigger-ratio: 0.8
  # ---- 联网搜索配置 ----
  search:
    enabled: false
    provider: bing
    bing-api-key:  # 替换为你的Bing API Key
    bing-endpoint: https://api.bing.microsoft.com/v7.0/search
    google-api-key:  # 替换为你的Google API Key
    google-cse-id:  # 替换为你的Google CSE ID
    max-results: 10
    timeout-ms: 10000
  # ---- 向量数据库配置 (Qdrant) ----
  vector:
    enabled: true
    provider: qdrant
    host: localhost
    port: 6333
    grpc-port: 6334
    api-key:  # 如果使用Qdrant Cloud则填写API Key
    collection-name: ich-knowledge
    # Embedding 模型配置
    embedding:
      model: BAAI/bge-large-zh-v1.5
      dimension: 1024
      api-url: https://api.siliconflow.cn/v1
      api-key: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  # 替换为你的SiliconFlow API Key
      use-remote: true
    # 检索配置
    search:
      top-k: 5
      score-threshold: 0.7

  # ---- 多模态配置（图片理解）----
  multimodal:
    enabled: false
    provider: anthropic
    model: claude-sonnet-4-20250514
    api-key: sk-ant-api03-xxxxxxxxxxxxxxxxxxxxxxxx  # 替换为你的Claude API Key
    timeout-seconds: 180
    max-tokens: 4096
    temperature: 0.7
  evaluation:
    enabled: true
    async: true
  prompts:
    master-brain-system: ""

logging:
  level:
    root: info
    com.hyang.ich.omnitrix: debug

# ============================================
# Spring Boot Actuator + Prometheus 配置
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    info:
      show-details: always
  metrics:
    tags:
      application: ich-omnitrix
    export:
      prometheus:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

# ============================================
# 自定义业务指标
# ============================================
omnitrix:
  metrics:
    enabled: true

